[flake8]
# House style: PEP 8, 79-char hard limit, Google docstrings.
max-line-length = 79
docstring-convention = google
extend-ignore =
    # black formats slices as `x[a : b]`, which E203 rejects.
    E203,
    # Line break BEFORE binary operator is the agreed style.
    W503,
    # House style: __init__ carries no docstring — document the class.
    D107
exclude =
    .git,
    __pycache__,
    workspace,
    workspace-native,
    artifacts,
    data,
    .pytest_cache
per-file-ignores =
    # A descriptive test name documents a test method.
    tests/*:D102
